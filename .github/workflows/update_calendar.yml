name: Auto Update Motorsport Calendar

on:
schedule:
- cron: '0 3 * * 1'
workflow_dispatch:

jobs:
update-calendar:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests

  - name: Run updater script
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    run: python update_calendar.py

  - name: Commit and push if CSV changed
    run: |
      git config --global user.name 'Calendar Bot'
      git config --global user.email 'bot@users.noreply.github.com'
      git add races_data.csv
      git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update races CSV [skip ci]" && git push)
